<title>Índice de Diseñadores</title>

<style>
/* =========================================================
   ÍNDICE DE DISEÑADORES · v3
   Ficha = F2 + F4 con el índice en horizontal.
   Tres estilos de índice × dos modos de lectura.
   Courier New Bold (Faxfont Standard primero). Sin webfonts.
   ========================================================= */

:root {
  --type: "Faxfont Standard", "Courier New", Courier, monospace;
  --bg: #ffffff;
  --fg: #000000;
  --dim: #767676;
  --lnk: #0000ee;
  --vis: #551a8b;
  --line: #bbbbbb;
  --line2: #e2e2e2;
  --ind: clamp(1.2rem, 8vw, 7rem);
  --measure: 68ch;
  --bar: 3px;
  --set: 46px;      /* franja de configuración */
  --idx: 44px;      /* índice horizontal */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --fg: #d2d0cb; --dim: #77746f;
    --lnk: #ece9e3; --vis: #8f8b84;
    --line: #2e2e2c; --line2: #1c1c1b;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --fg: #d2d0cb; --dim: #77746f;
  --lnk: #ece9e3; --vis: #8f8b84;
  --line: #2e2e2c; --line2: #1c1c1b;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--type); font-weight: 700;
  font-size: 15px; line-height: 1.75; letter-spacing: 0.005em;
}
:focus-visible { outline: 2px solid var(--fg); outline-offset: -3px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition-duration: .01ms !important; } }


/* ---- progreso de lectura ---- */
.progress {
  position: fixed; top: 0; left: 0; right: 0; z-index: 51;
  height: var(--bar); background: var(--line2);
}
.progress i {
  display: block; height: 100%; width: 0%; background: var(--dim);
  transition: width .1s linear;
}
body:not([data-view="ccp"]) .progress { visibility: hidden; }

/* ---- configuración ---- */
.settings {
  position: fixed; top: var(--bar); left: 0; right: 0; z-index: 50;
  height: var(--set); margin: 0; padding: 0 clamp(1.1rem, 4vw, 3rem);
  display: flex; align-items: center; justify-content: flex-end;
  background: var(--bg); border-bottom: 1px solid transparent;
  transition: border-color .2s ease;
  font-weight: 400; font-size: 0.8em; color: var(--dim);
}
body[data-scrolled] .settings { border-bottom-color: var(--line); }
.settings button {
  font: inherit; background: none; border: 0; padding: 0; margin: 0;
  color: var(--lnk); text-decoration: underline; cursor: pointer;
}
.settings button:hover { color: var(--fg); }
.settings button[aria-pressed="true"] { color: var(--fg); text-decoration: none; cursor: default; font-weight: 700; }
.settings .sep { margin: 0 0.5em; }

#view { padding-top: calc(var(--bar) + var(--set)); }

/* ===================== PORTADA ===================== */
.cover { min-height: calc(100vh - var(--bar) - var(--set)); display: flex; flex-direction: column; justify-content: center; }
.cover .title {
  font-weight: 400; font-size: 0.8em; letter-spacing: 0.34em; text-transform: uppercase;
  color: var(--dim); text-align: center; margin: 0;
  padding: 0 1.1rem clamp(2.4rem, 9vh, 5.5rem);
}
.list { border-top: 1px solid var(--line); }
.designer {
  display: block; width: 100%; text-decoration: none; color: var(--fg);
  border-bottom: 1px solid var(--line);
  padding: clamp(1.4rem, 4.5vh, 2.6rem) clamp(1.1rem, 4vw, 3rem);
  padding-left: var(--ind);
  font-size: clamp(1.05em, 3.8vw, 2em); line-height: 1.2; letter-spacing: 0.01em;
  transition: background .14s ease, color .14s ease, padding-left .2s ease;
}
a.designer:visited { color: var(--fg); }
a.designer:hover, a.designer:focus-visible {
  background: var(--fg); color: var(--bg);
  padding-left: calc(var(--ind) + clamp(0.5rem, 1.8vw, 1.4rem));
}
.designer.pending { color: var(--dim); font-weight: 400; }

/* ===================== FICHA ===================== */
.file a { color: var(--lnk); }
.file a:visited { color: var(--vis); }
.pad { padding-left: var(--ind); padding-right: clamp(1.1rem, 4vw, 3rem); }
.back { font-weight: 400; font-size: 0.8em; margin: 0; padding-top: 2.6rem; }
.masthead { padding: 1.2rem 0 2.4rem; max-width: 72ch; }
.masthead h1 { font-size: clamp(1.1em, 4.4vw, 1.9em); line-height: 1.25; margin: 0 0 0.5rem; letter-spacing: 0.01em; }
.masthead .dek { font-weight: 400; font-size: 0.8em; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); margin: 0; }

/* ---------- índice horizontal ---------- */
.idxbar {
  position: sticky; top: calc(var(--bar) + var(--set)); z-index: 40;
  background: var(--bg);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.idxbar .strip {
  display: flex; align-items: stretch;
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.idxbar .strip::-webkit-scrollbar { display: none; }
.idxbar button {
  font: inherit; background: none; color: var(--fg); border: 0;
  cursor: pointer; white-space: nowrap;
  display: flex; align-items: center; gap: 1ch;
  transition: background .12s ease, color .12s ease;
}
.idxbar button .n { font-weight: 400; color: var(--dim); }
.idxbar button:hover { background: var(--fg); color: var(--bg); }
.idxbar button:hover .n { color: var(--bg); }
.idxbar button[aria-current="true"] { background: var(--fg); color: var(--bg); }
.idxbar button[aria-current="true"] .n { color: var(--bg); }

/* A · inline — una línea corrida, se scrollea sola */
.i-inline .strip { padding: 0 clamp(1.1rem, 4vw, 3rem) 0 var(--ind); gap: 0; }
.i-inline button { padding: 0.7rem 1.1ch; font-size: 0.85em; }
.i-inline button + button { margin-left: 1.6ch; }

/* B · celdas — a sangre, divididas por filete */
.i-cells .strip { padding: 0; }
.i-cells button {
  flex: 1 0 auto; min-width: 15ch; justify-content: flex-start;
  padding: 0.75rem 1ch; font-size: 0.82em;
  border-right: 1px solid var(--line2);
}
.i-cells button:last-child { border-right: 0; }

/* C · números — sólo la cifra, el nombre aparece al lado */
.i-nums .strip { padding: 0 clamp(1.1rem, 4vw, 3rem) 0 var(--ind); align-items: center; }
.i-nums button { padding: 0.7rem 0.9ch; font-weight: 400; color: var(--dim); font-size: 0.9em; }
.i-nums button[aria-current="true"] { font-weight: 700; }
.i-nums .now {
  margin-left: 1.6ch; padding-left: 1.6ch; border-left: 1px solid var(--line2);
  font-size: 0.85em; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
}

/* ---------- contenido ---------- */
.body { padding-top: 2.6rem; padding-bottom: 8rem; }
.sec > h2 { font-size: 1.15em; letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 1.6rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--line); max-width: 96ch; }
.sec > h2 .n { font-weight: 400; color: var(--dim); margin-right: 1.2ch; }
.r-cont .sec { padding-bottom: 4.5rem; scroll-margin-top: calc(var(--bar) + var(--set) + var(--idx) + 1rem); }
.r-one .nav { display: flex; justify-content: space-between; gap: 1rem; margin-top: 3.5rem; padding-top: 1.2rem; border-top: 1px solid var(--line); font-weight: 400; font-size: 0.85em; max-width: 96ch; }
.r-one .nav button { font: inherit; background: none; border: 0; color: var(--lnk); text-decoration: underline; cursor: pointer; padding: 0; text-align: left; }
.r-one .nav button:last-child { text-align: right; }
.r-one .nav button:disabled { color: var(--dim); text-decoration: none; cursor: default; }

/* bloques */
.b h3 { font-size: 0.8em; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); margin: 2.4rem 0 1rem; }
.b p { margin: 0 0 1rem; max-width: var(--measure); }
.b .note { font-weight: 400; color: var(--dim); max-width: var(--measure); border-left: 1px solid var(--line); padding-left: 1rem; margin: 1.6rem 0 0; }
.b .ref { font-weight: 400; font-size: 0.8em; letter-spacing: 0.04em; color: var(--dim); }
.b .note .ref { display: block; margin-top: 0.4rem; }
.b dl { margin: 0; max-width: 96ch; }
.b dl > div { padding: 0.9rem 0; border-top: 1px solid var(--line2); }
.b dl > div:first-child { border-top: 0; padding-top: 0; }
.b dt { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.86em; margin-bottom: 0.25rem; }
.b dd { margin: 0; max-width: var(--measure); font-weight: 400; }
.b dd .ref { display: block; margin-top: 0.3rem; }
.b .scroll { overflow-x: auto; margin: 0.4rem 0 1.3rem; max-width: 96ch; }
.b table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
.b th, .b td { border: 1px solid var(--line); padding: 0.45rem 0.6rem; text-align: left; vertical-align: top; }
.b th { font-weight: 400; font-size: 0.82em; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.b td { font-weight: 400; }
.b td:first-child { font-weight: 700; }
.b table.tl td:first-child { font-weight: 400; color: var(--dim); white-space: nowrap; font-size: 0.9em; }
.b table.tl td:nth-child(2) { font-weight: 700; }
.b .anat { margin: 0.4rem 0 1.3rem; }
.b .anat .code { font-size: clamp(0.95em, 3.2vw, 1.35em); letter-spacing: 0.04em; margin-bottom: 1rem; }
.b .anat .code b { border-bottom: 2px solid var(--fg); padding-bottom: 2px; }
.b .anat dl > div { display: grid; grid-template-columns: 9ch minmax(0, 1fr); gap: 1rem; }
.b .anat dt { text-transform: none; letter-spacing: 0; }
.b .colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 0.8rem; margin: 0.4rem 0 1.3rem; max-width: 96ch; }
.b .colors div { display: flex; align-items: center; gap: 0.6rem; font-weight: 400; font-size: 0.88em; }
.b .colors i { flex: 0 0 auto; width: 1.4rem; height: 1.4rem; border: 1px solid var(--line); }
.b .colors b { color: var(--dim); font-size: 0.9em; }
/* enlaces del documento, al final de cada tema */
.links { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--line); max-width: 96ch; }
.links h3 { margin: 0 0 0.8rem; }
.links ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(28ch, 1fr)); gap: 0.15rem 1.6rem; }
.links li { font-weight: 400; font-size: 0.88em; }
.links a { text-decoration: none; }
.links a:hover { text-decoration: underline; }
.links .ar { color: var(--dim); margin-right: 0.8ch; }
.links a[data-local="1"] { color: var(--dim); }
.links a[data-local="1"]:hover { color: var(--fg); }

/* vídeos, reproducidos dentro de la página */
.links.vids { max-width: 128ch; }
.links.vids .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: 1.4rem 1.2rem; }
.vid { margin: 0; }
.vid .play {
  position: relative; display: block; width: 100%; aspect-ratio: 16/9; padding: 0; cursor: pointer;
  background: #000; border: 1px solid var(--line);
  transition: border-color .14s ease;
}
.vid .play:hover { border-color: var(--fg); }
.vid .tri {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: 0; height: 0; border-style: solid; border-width: 11px 0 11px 19px;
  border-color: transparent transparent transparent #d2d0cb;
  transition: border-left-color .14s ease;
}
.vid .play:hover .tri { border-left-color: #fff; }
.vid iframe, .vid video { display: block; width: 100%; aspect-ratio: 16/9; border: 1px solid var(--line); background: #000; }
.vid figcaption { display: flex; gap: 1ch; align-items: baseline; font-weight: 400; font-size: 0.85em; padding-top: 0.5rem; }
.vid figcaption .t { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.vid figcaption a { text-decoration: none; color: var(--dim); flex: 0 0 auto; }
.vid figcaption a:hover { color: var(--fg); }

.b dd .ex { display: block; margin-top: 0.8rem; max-width: 16rem; }
.b dd .ex img { display: block; width: 100%; border: 1px solid var(--line); }
.b dd .ex figcaption { font-weight: 400; font-size: 0.78em; color: var(--dim); margin-top: 0.35rem; }
.b dd .ex figcaption a { color: inherit; text-decoration: none; }
.b dd .ex figcaption a:hover { color: var(--fg); }

.b .sources > div { padding: 1rem 0; border-top: 1px solid var(--line2); max-width: var(--measure); font-weight: 400; }
.b .sources .sg { font-weight: 700; letter-spacing: 0.12em; display: block; margin-bottom: 0.25rem; }
.b .sources .st { display: block; color: var(--dim); margin-top: 0.25rem; }

@media (max-width: 640px) {
  .pad { padding-left: 1.1rem; }
  .i-inline .strip, .i-nums .strip { padding-left: 1.1rem; }
  .b .anat dl > div { grid-template-columns: 1fr; gap: 0.2rem; }
}
</style>
</head>

    ["2024", ["In-Between","In-Between"], ["Cápsula final: delantal de bisonte, Sifter Arms, reedición de Buckle Boots.","Final capsule: bison apron, Sifter Arms, Buckle Boots reissue."]]

/* ------------------------------------------------ 3 */
{ id: "metodo", n: "03", t: ["Filosofía y método", "Philosophy and method"], blocks: [
  { k: "sub", tx: ["Principios", "Principles"] },
  { k: "entries", rows: [
    [["Negación","Negation"], ["No se parte de una idea buscando cómo realizarla: se eliminan las soluciones posibles hasta que la que queda es forzosamente la correcta. «La negación de las posibilidades creativas es lo que crea el tipo, la forma y el diseño de una pieza.»","He does not start from an idea and look for a way to realise it: possible solutions are eliminated until the one left is necessarily the right one. “The negation of creative possibilities is what creates the type, the form and the design of a piece.”"], "LEHMANN pp. 172-183 · MICHEL pp. 10-12"],
    [["Entziehung","Entziehung"], ["«Retirada», término tomado de Thomas Bernhard. Nombra a la vez un método material —alejarse de la codificación y la tipología— y una posición política: aislamiento y alienación convertidos en concepto estético.","“Withdrawal”, a term taken from Thomas Bernhard. It names both a material method — moving away from codification and typology — and a political position: isolation and alienation turned into an aesthetic concept."], "LEHMANN pp. 179-182"],
    [["Fuera del mercado","Outside the market"], ["«Produzco cuestionando el sistema capitalista.» No opera fuera del capitalismo: lo atraviesa de otro modo. Sin publicidad, patrocinios, celebrities, préstamos ni calendario.","“I produce by questioning the capitalist system.” He does not operate outside capitalism: he passes through it differently. No advertising, sponsorship, celebrities, loans or calendar."], "LEHMANN p. 180 · OAC"],
    [["Autodefinición","Self-definition"], ["«Ricercatore», investigador. Trabaja «desde el inconsciente más profundo», sin concepto estético previo: «la estética es el resultado de la exploración inquisitiva».","“Ricercatore”, researcher. He works “from the deepest unconscious”, with no prior aesthetic concept: “aesthetics is the result of inquisitive exploration”."], "FASHIONNOW2 p. 139 · POELLINFO lám. 03/10"]
  ]},
  { k: "sub", tx: ["El taller", "The workshop"] },
  { k: "entries", rows: [
    [["El espacio","The space"], ["Segunda planta de una nave del sur de Milán, ocupada diecisiete años; antiguo taller de escenografía de la Ópera. Los raíles del techo cuelgan hoy muestras y el archivo de patrones de papel.","The second floor of a warehouse in southern Milan, occupied for seventeen years; formerly the Opera's set-building workshop. The ceiling rails now hang samples and the paper-pattern archive."], "LEHMANN pp. 175-178"],
    [["La diferencia","The difference"], ["Un atelier de alta costura sabe montar una prenda pero compra sus materiales. C.C.P. los produce: hilos, hilaturas, tejido, tintura y curtido, además del corte y la confección.","A couture atelier knows how to assemble a garment but buys its materials. C.C.P. produces them: threads, yarns, fabric, dyeing and tanning, as well as cutting and making."], "LEHMANN p. 176"],
    [["Bonotto","Bonotto"], ["El tejedor de Molvena que produce buena parte de sus tejidos, en una fabbrica lenta con telares antiguos manipulables. Para Poell, el acabado —no el tejido— aporta el 60-70 % del carácter del material.","The weaver in Molvena who produces much of his cloth, in a slow factory with old, manipulable looms. For Poell the finishing — not the weaving — accounts for 60-70 % of a material's character."], "LEHMANN, cap. “Primary Material”"]
  ]},
  { k: "sub", tx: ["Los procesos invertidos", "The inverted processes"] },
  { k: "p", tx: [
    "La firma técnica de la casa: la industria trata el material y luego construye; CCP construye primero y trata después. De aquí se derivan casi todas las demás técnicas.",
    "The house's technical signature: industry treats the material and then builds; CCP builds first and treats afterwards. Almost every other technique derives from this."
  ]},
  { k: "table", head: [["Proceso","Process"], ["Qué invierte","What it inverts"], ["Consecuencia","Consequence"]], rows: [
    [["Object dyeing · tintura in capo","Object dyeing · tintura in capo"], ["La prenda entera —costuras, forros, herrajes— se tiñe después de construida, en bombo.","The whole garment — seams, linings, hardware — is dyed after being built, in a drum."], ["Tono y encogimiento imprevisibles; secado y pulido a mano. Cada pieza sale distinta.","Unpredictable tone and shrinkage; drying and polishing by hand. Every piece comes out different."]],
    [["Object tanning · concia in capo","Object tanning · concia in capo"], ["La prenda se cose con la piel cruda y se curte y tiñe entera al final.","The garment is sewn from raw hide and then tanned and dyed whole at the end."], ["Patrón calculado con 10-15 % de exceso. Se cose con guantes de cota de malla. El curtido integra la costura en el cuero.","The pattern is cut with 10-15 % excess. Sewn wearing chainmail gloves. Tanning integrates the seam into the leather."]],
    [["Object tempering","Object tempering"], ["Membrana fina de canguro entre paneles de cuero de caballo.","A thin kangaroo membrane between horse-leather panels."], ["Crea articulaciones: más movilidad sin forzar el material.","Creates articulations: more movement without forcing the material."]]
  ]},
  { k: "note", ref: "LEHMANN pp. 177-190", tx: [
    "El proceso completo del «Tanned Coat» —los colchones empapados para que la piel no se momifique, los frigoríficos nocturnos, el 50-60 % de muestras perdidas— y el de las botas protésicas, en LEHMANN.",
    "The full process of the “Tanned Coat” — the soaked mattresses that keep the hide from mummifying, the overnight refrigeration, the 50-60 % of samples lost — and that of the prosthetic boots, in LEHMANN."
  ]}
]},

/* ------------------------------------------------ 4 */
{ id: "tecnica", n: "04", t: ["Técnica", "Technique"], blocks: [
  { k: "sub", tx: ["Sastrería", "Tailoring"] },
  { k: "p", tx: [
    "Las costuras son el núcleo del sistema: en cualquier prenda unen, articulan y garantizan la integridad —fuertes para durar, débiles para ceder ante una tensión inesperada—. Poell exagera las dos funciones.",
    "Seams are the core of the system: in any garment they join, articulate and guarantee integrity — strong enough to last, weak enough to give under unexpected tension. Poell exaggerates both functions."
  ]},
  { k: "table", head: [["Costura","Seam"], ["Qué es","What it is"], ["Efecto","Effect"]], rows: [
    [["Taped-seam","Taped-seam"], ["Reforzada con cinta transparente termosellada.","Reinforced with heat-sealed transparent tape."], ["Exhibe la costura que el forro escondía; sin forro desde 2003, doblemente visible.","Exhibits the seam the lining used to hide; unlined since 2003, doubly visible."]],
    [["Meltlock-seam","Meltlock-seam"], ["La costura se sobrefunde con cinta más gruesa.","The seam is over-fused with thicker tape."], ["Refuerza el interior del overlock y lo vuelve rígido.","Reinforces the inside of the overlock and stiffens it."]],
    [["Scar-stitch","Scar-stitch"], ["Sobrehilado con aspecto de cicatriz.","An overcast stitch that looks like a scar."], ["Cosido por dentro, visible por fuera. Punto apretado, rígido.","Sewn from within, visible from without. Tight, rigid stitch."]],
    [["Overlock-seam","Overlock-seam"], ["Hilo grueso, puntos separados.","Thick thread, widely spaced stitches."], ["El rasgo más reconocible de la casa.","The house's most recognisable feature."]],
    [["Invisible-seam","Invisible-seam"], ["Hilo de nailon translúcido y flexible.","Translucent, flexible nylon thread."], ["Sin tensión cierra; con tensión abre sin romperse y revela la carne.","Under no tension it closes; under tension it opens without breaking and reveals the flesh."]],
    [["Chain-seam","Chain-seam"], ["Hilo rígido, punto de cadeneta.","Rigid thread, chain stitch."], ["Deja la costura permanentemente abierta.","Leaves the seam permanently open."]]
  ]},
  { k: "entries", rows: [
    [["El sistema","The system"], ["Las costuras agotan las cuatro combinaciones de continuo/discontinuo y rígido/flexible. La invisible ocupa dos casillas a la vez. Y el cambio decisivo es topológico: la invisible y la chain no están ni dentro ni fuera, están en medio.","The seams exhaust the four combinations of continuous/discontinuous and rigid/flexible. The invisible one occupies two cells at once. And the decisive shift is topological: the invisible and the chain seam are neither inside nor outside, they are in between."], "MICHEL pp. 8-12"],
    [["El significado","The meaning"], ["La cicatriz es la huella de una herida cuyos bordes se reunieron: prueba de que la curación prevaleció. Coser es luchar contra la muerte, la discontinuidad fundamental. Es el tema central de la obra.","The scar is the trace of a wound whose edges came back together: proof that healing prevailed. To sew is to fight against death, the fundamental discontinuity. This is the central theme of the work."], "MICHEL pp. 12-15"],
    [["Self-Edge","Self-Edge"], ["El orillo —borde autoacabado del tejido— usado en curvas y no sólo en rectas, lo que exige el doble o el cuádruple de metros. Las prendas quedan tan rígidas que se sostienen solas de pie.","The selvedge — the fabric's self-finished edge — used on curves and not only on straight lines, which demands two to four times the yardage. The garments end up so rigid they stand up on their own."], "POELLINFO c. 16 · c. 17", "archivo/poellinfo/16-self-edge.jpg"],
    [["Dead-End","Dead-End"], ["El opuesto: la ropa nunca llega a juntarse. Piezas unidas con cinta o cadeneta, con aspecto de estar desgarrándose. La emblemática es la prenda «one piece» de doble cicatriz asimétrica: es porque se mantiene la discontinuidad entre las dos cicatrices que la prenda resulta continua.","The opposite: the clothing never quite comes together. Pieces joined with tape or chain stitch, looking as if they were tearing. The emblematic one is the “one piece” garment with an asymmetric double scar: it is because the discontinuity between the two scars is maintained that the garment turns out continuous."], "MICHEL pp. 14-15"],
    [["Tornado / Spiral","Tornado / Spiral"], ["Pantalones cuyo giro se consigue por patrón y construcción —un cordón en espiral incorporado—, no por una segunda capa. De los «Bandage Strap Pants» de AW 00-01 a los Full y Half Spiral de 2009-2010.","Trousers whose twist is achieved through pattern and construction — an incorporated spiral cord — not through a second layer. From the AW 00-01 “Bandage Strap Pants” to the Full and Half Spiral of 2009-2010."], "POELLINFO c. 26", "archivo/poellinfo/26-tornado-pants.jpg"],
    [["Perforación","Perforation"], ["Dos técnicas: corte láser (SS 02, hecho después de construir la prenda, lo que deja bordes inseguros) y punzonado. El cuero perforado tuvo una única temporada, SS 08 —con las suelas también perforadas—.","Two techniques: laser cutting (SS 02, done after the garment is built, which leaves unstable edges) and punching. Perforated leather had a single season, SS 08 — with the soles perforated too."], "POELLINFO c. 15 · c. 14", "archivo/poellinfo/14-perforated-leather.jpg"],
    [["Silueta","Silhouette"], ["Sisas estrechas que fuerzan una postura erguida —«sastrería ortopédica»—, hombro híbrido (sastre delante, raglán detrás), ausencia de forro, asimetría. Giro tardío hacia el volumen en las piezas recientes.","Narrow armholes that force an upright posture — “orthopaedic tailoring” — a hybrid shoulder (tailored in front, raglan behind), no lining, asymmetry. A late turn towards volume in the recent pieces."], "MICHEL p. 1 · POELLINFO c. 22"]
  ]},
  { k: "sub", tx: ["Tejido", "Fabric"] },
  { k: "p", tx: [
    "Desarrolla el 90 % de los tejidos que usa desde el primer paso de su producción.",
    "He develops 90 % of the fabrics he uses from the first step of their production."
  ]},
  { k: "table", head: [["Tejido","Fabric"], ["Composición","Composition"], ["Comportamiento","Behaviour"]], rows: [
    [["SURFACE","SURFACE"], ["80 % lana · 20 % ramio","80 % wool · 20 % ramie"], ["Grueso, seco, áspero. Sostiene cantos rígidos y cuellos que no se arrugan.","Thick, dry, coarse. Holds rigid edges and collars that do not crease."]],
    [["KOAT","KOAT"], ["100 % algodón","100 % cotton"], ["Mismo peso, tacto suave. Sólo negro y blanco.","Same weight, soft hand. Black and white only."]],
    [["ACA-EDGE","ACA-EDGE"], ["100 % lana virgen","100 % virgin wool"], ["Ligero y muy seco; el cuello queda más blando. El más caro de la familia -EDGE.","Light and very dry; the collar stays softer. The most expensive of the -EDGE family."]],
    [["PEDGE","PEDGE"], ["100 % algodón","100 % cotton"], ["Muy tupido. Blazers y vest bags, con la línea roja del orillo a la vista.","Very dense. Blazers and vest bags, with the selvedge's red line on show."]],
    [["CO-EDGE / CON-EDGE","CO-EDGE / CON-EDGE"], ["100 % algodón","100 % cotton"], ["Transpirable, estructurado y crujiente. CON-EDGE, para trajes.","Breathable, structured and crisp. CON-EDGE for suiting."]],
    [["ROR-EDGE / RAR-EDGE","ROR-EDGE / RAR-EDGE"], ["55 ramio + 45 lana / 100 ramio","55 ramie + 45 wool / 100 ramie"], ["Envejece como un denim crudo: marca pliegues y destiñe alrededor.","Ages like raw denim: it creases and bleeds around the folds."]],
    [["KITE-S","KITE-S"], ["Poliéster termosellado","Heat-sealed polyester"], ["Forro-cáscara de SS 08. Da nombre a las prendas -chute.","The shell-lining of SS 08. It gives the -chute garments their name."]],
    [["DIAGON · LOCH · HAIR · ELEFANT","DIAGON · LOCH · HAIR · ELEFANT"], ["—","—"], ["De Instant Collection. HAIR es cuero con el pelo intacto.","From Instant Collection. HAIR is leather with the hair left on."]]
  ]},
  { k: "sub", tx: ["Cuero · leer una etiqueta", "Leather · reading a label"] },
  { k: "label", code: "LM/2498 CORS-PTC/12", parts: [
    ["LM/2498", ["modelo","model"]],
    ["CORS", ["cuero de caballo","horse leather"]],
    ["-PTC", ["pronto per tintura in capo · listo para teñir en prenda","pronto per tintura in capo · ready for garment dyeing"]],
    ["/12", ["color verde oscuro 12","colour 12, dark green"]]
  ], tail: [
    "El sufijo -PCC (concia in capo) significa, en cambio, listo para curtir en prenda.",
    "The suffix -PCC (concia in capo) means, instead, ready for garment tanning."
  ]},
  { k: "table", head: [["Código","Code"], ["Especie","Species"], ["Código","Code"], ["Especie","Species"]], rows: [
    [["BIAS · BIUS · BUUS","BIAS · BIUS · BUUS"], ["Bisonte: fino · grueso · troquelado","Bison: fine · thick · embossed"], ["ROOLS · ROOMS · RUUMS","ROOLS · ROOMS · RUUMS"], ["Canguro: 0,4-0,5 mm · 0,8-0,9 mm · troquelado","Kangaroo: 0.4-0.5 mm · 0.8-0.9 mm · embossed"]],
    [["CORS · CORSS","CORS · CORSS"], ["Caballo, parte delantera: normal · grueso","Horse, front section: normal · thick"], ["PACAL","PACAL"], ["Ternera con polietileno que produce desgarros únicos","Calf with polyethylene, producing unique tears"]],
    [["CUBS · CUL","CUBS · CUL"], ["Cordobán por el revés: wet white · vegetal","Shell cordovan, flesh side: wet white · vegetable"], ["SBUC · LUC","SBUC · LUC"], ["Cordobán por la flor: wet white · vegetal","Shell cordovan, grain side: wet white · vegetable"]]
  ]},
  { k: "entries", rows: [
    [["Wet white","Wet white"], ["Curtido sin cromo (glutaraldehído, sintanos, taninos o sales de aluminio y circonio). Queda claro, lo que lo hace apto para recibir después cualquier tono: justo lo que exige el object dyeing. Se opone al wet blue, el curtido al cromo estándar de la industria, que CCP no usa.","Chrome-free tanning (glutaraldehyde, syntans, tannins or aluminium and zirconium salts). It stays pale, which makes it able to take any tone afterwards: exactly what object dyeing requires. It stands against wet blue, the industry-standard chrome tanning, which CCP does not use."], "LAZZARI"],
    [["Curtido vegetal","Vegetable tanning"], ["Con taninos. Más lento y rígido; desarrolla pátina y oscurece. En CCP se reserva a los colores muy oscuros (10 negro, 12 verde oscuro).","With tannins. Slower and stiffer; it develops a patina and darkens. At CCP it is reserved for the very dark colours (10 black, 12 dark green)."], "LAZZARI"],
    [["Cordobán","Shell cordovan"], ["Piel equina de la grupa, de Córdoba. Admite mal el tinte, se tiñe a mano por dentro, se engrasa a los diez días y se pule con rodillo de cristal o ágata. Seis meses de proceso.","Equine hide from the rump, from Córdoba. It takes dye poorly, is hand-dyed from the inside, oiled after ten days and polished with a glass or agate roller. A six-month process."], "LAZZARI"]
  ]},
  { k: "colors", tx: ["Los colores", "The colours"], note: [
    "Cada código es una fórmula de tintura, no un tono nominal: 10 es el negro para tejido y 010 el negro para cuero.",
    "Each code is a dye formula, not a nominal shade: 10 is black for fabric and 010 black for leather."
  ], rows: [
    ["01", "#f4f4f2", ["blanco brillante","bright white"]],
    ["03", "#e8ded9", ["blanco natural / rosa pálido","natural white / pale pink"]],
    ["06", "#9aa87f", ["verde claro","light green"]],

    ["14A", "#c2521a", ["naranja","orange"]],
    ["15", "#3d1526", ["rojo violeta oscuro","dark violet red"]],
    ["16", "#2a2f7a", ["azul eléctrico / púrpura","electric blue / purple"]],
    ["19", "#3a3c3b", ["gris oscuro","dark grey"]],
    ["29", "#101726", ["azul extremadamente oscuro","extremely dark blue"]],

  { k: "sub", tx: ["Cueros extremos", "Extreme leathers"] },
  { k: "entries", rows: [
    [["Transparente","Transparent"], ["Se retira el pigmento hasta hacer la piel translúcida, por un método arcaico y sin precedentes; presentado en 2000. No era estable: una pieza actual estaría en descomposición.","The pigment is withdrawn until the hide becomes translucent, by an archaic and unprecedented method; presented in 2000. It was not stable: a piece today would be decomposing."], "POELLINFO c. 5", "archivo/poellinfo/5-transparent-leather.jpg"],
    [["Teñido en sangre","Blood-dyed"], ["El interior del cuero untado con sangre animal, «para devolverle la vida»: la química de la sangre cambia de tono con el tiempo.","The inside of the leather smeared with animal blood, “to give it back its life”: the chemistry of the blood shifts tone over time."], "GRAILED · LPA"],
    [["Tinte inyectado","Injected dye"], ["Pintura inyectada a través de las venas de la piel, para que las vías de la sangre queden visibles. No confundir con el bulo del animal vivo.","Paint injected through the hide's veins, so that the blood's channels stay visible. Not to be confused with the live-animal hoax."], "POELLINFO c. 27", "archivo/poellinfo/27-injected-dye.jpg"],
    [["Calzado","Footwear"], ["Drip: caucho líquido que solidifica en estalactitas; sella la suela y está hecho para desgastarse —hacia el quinto uso el zapato es normal—. U-sole: suela que se envuelve sobre sí misma creando una cámara de aire.","Drip: liquid rubber that solidifies into stalactites; it seals the sole and is made to wear away — by about the fifth wear the shoe is normal. U-sole: a sole that wraps over itself, creating an air chamber."], "POELLINFO c. 32 · c. 30", "archivo/poellinfo/32-drip-rubber.jpg"]
  ]},
  { k: "sub", tx: ["Agregados", "Add-ons"] },
  { k: "entries", rows: [
    [["Prótesis craneofaciales","Craniofacial prostheses"], ["Dientes, ojos, lengua, cabello. Una prótesis real imita su equivalente natural para disimular una malformación; Poell abandona esa función y las expone como joyería, separadas del cuerpo.","Teeth, eyes, tongue, hair. A real prosthesis imitates its natural equivalent to disguise a malformation; Poell abandons that function and displays them as jewellery, separated from the body."], "POELLINFO c. 9", "archivo/poellinfo/9-prosthetic-eyes.jpg"],
    [["Prótesis de titanio","Titanium prostheses"], ["En dedos, codos, tobillos, rodillas, talones y puntas. Las fabrica un taller de Vicenza que normalmente hace punteras de seguridad. No restringen el cuerpo: demuestran la otredad de la prenda.","On fingers, elbows, ankles, knees, heels and toes. Made by a workshop in Vicenza that normally produces safety toecaps. They do not restrict the body: they demonstrate the garment's otherness."], "POELLINFO c. 10 · LEHMANN p. 177", "archivo/poellinfo/10-prosthetic-gloves.jpg"],
    [["Metal","Metal"], ["Titanio en codos y nudillos; cota de malla; sujetador metálico. La cadena del puño americano recorre toda la obra: puño de bronce → anillo de cuatro eslabones → prótesis de nudillo.","Titanium on elbows and knuckles; chainmail; metal bra. The knuckleduster's chain runs through the whole body of work: bronze knuckleduster → four-link ring → knuckle prosthesis."], "KITCHELL"],
    [["Accesorios","Accessories"], ["Kitchell los ordena en cinco categorías, de menos a más dramatizados: utilidad banal (imperdible, bolígrafo, portapapeles) · restricción (guantes que fusionan dedos, molde que bloquea el codo) · disfraz irónico (nariz de payaso, gorguera isabelina) · violencia (puño americano, collar de 2 kg) · sacrificio (pata de animal, boa de intestino).","Kitchell sorts them into five categories, from least to most dramatised: banal utility (safety pin, pen, clipboard) · restriction (gloves that fuse fingers, a cast that locks the elbow) · ironic disguise (clown nose, Elizabethan ruff) · violence (knuckleduster, 2 kg collar) · sacrifice (animal leg, intestine boa)."], "KITCHELL"],
    [["Bolsos","Bags"], ["La Multi-dimensional Bag reproduce el marco de precintado de las bolsas soviéticas de transporte de dinero de 1961, en cuero de caballo sumergido en caucho. El AM/2573 vest bag parte de un chaleco salvavidas del ejército estadounidense de 1967.","The Multi-dimensional Bag reproduces the sealing frame of Soviet 1961 money-transport bags, in horse leather dipped in rubber. The AM/2573 vest bag starts from a 1967 US Army life vest."], "POELLINFO c. 19 · c. 1", "archivo/poellinfo/19-bag.jpg"],
    [["Materiales límite","Limit materials"], ["Fibra de vidrio: abrigo de 2009 que exigía guantes, mascarilla y gafas para coserlo y que no puede llevarse; aun así se vendieron dos. DARM: intestino de cerdo convertido en punto. Cabello humano: comprado en la feria de fabricantes de pelucas.","Fibreglass: a 2009 coat that required gloves, mask and goggles to sew and that cannot be worn; two were sold anyway. DARM: pig intestine turned into knit. Human hair: bought at the wigmakers' fair."], "LEHMANN pp. 184-186 · POELLINFO c. 20 · MICHEL p. 16"]
  ]}
]},

/* ------------------------------------------------ 5 */
{ id: "estetica", n: "05", t: ["Estética, temas e influencias", "Aesthetics, themes and influences"], blocks: [
  { k: "sub", tx: ["Temas", "Themes"] },
  { k: "entries", rows: [
    [["Vida y muerte","Life and death"], ["El tema matriz. Lo vegetal frente a lo animal, tejer —crear tejido nuevo— frente a curtir —eternizar una piel muerta—. No es una obra macabra sino una tensión heraclítea irresuelta.","The matrix theme. The vegetal against the animal, weaving — creating new tissue — against tanning — making a dead skin eternal. This is not macabre work but an unresolved Heraclitean tension."], "MICHEL pp. 12-15"],
    [["La herida","The wound"], ["Perforado, tejidos que se disuelven y aberturas frente a las adiciones protésicas. Pero los signos sólo cuentan cuando se ponen en juego llevando la ropa: la moda como herida, transgresión y apertura a la vez.","Perforation, dissolving fabrics and openings against prosthetic additions. But the signs only count when they are put at stake by wearing the clothes: fashion as wound, transgression and opening at once."], "POELLINFO c. 35"],
    [["Soberanía animal","Animal sovereignty"], ["Usa subproductos de animales consumidos como alimento, no pieles exóticas. Three Refrigerated Cells se niega a mantener la distancia entre origen y resultado: «lo oculto permite explotar; ser honrado es recuperar presencia».","He uses by-products of animals eaten as food, not exotic skins. Three Refrigerated Cells refuses to keep the distance between origin and result: “what is hidden permits exploitation; to be honest is to recover presence”."], "POELLINFO c. 18 · MICHEL p. 21"],
    [["Exoesqueleto","Exoskeleton"], ["Disjointed funde lo artrópodo y lo medieval: capucha que es bacinete o isópodo, parka con cola, hebillas como vértebras. La prenda permite convertirse en monstruo y hallar seguridad en la otredad.","Disjointed fuses the arthropod and the medieval: a hood that is a bascinet or an isopod, a parka with a tail, buckles like vertebrae. The garment lets you become a monster and find safety in otherness."], "POELLINFO c. 29"],
    [["Valor ganado","Earned value"], ["La comodidad no se da, se gana: la ropa necesita uso para adaptarse. Resistencia al «alisamiento» de la cultura tardomoderna, emparentada con el wabi-sabi.","Comfort is not given, it is earned: the clothing needs wear in order to adapt. A resistance to the “smoothing” of late-modern culture, akin to wabi-sabi."], "OAC"],
    [["Paradoja","Paradox"], ["Los opuestos coexisten en la misma prenda: piel y armadura, rígido y flexible, fascinación y repulsión. La incomodidad no es consecuencia de su investigación: es su base.","Opposites coexist in the same garment: skin and armour, rigid and flexible, fascination and repulsion. Discomfort is not a consequence of his research: it is its basis."], "MICHEL pp. 21-23"],
    [["Abyección","Abjection"], ["El collar de dientes y el anillo de ojo representan partes del cuerpo que entendemos como separables. Objetos abyectos en el sentido de Kristeva: lo que se expulsa por amenazar el orden.","The teeth collar and the eye ring stand for parts of the body we understand as detachable. Abject objects in Kristeva's sense: what is expelled because it threatens order."], "KITCHELL"]
  ]},
  { k: "sub", tx: ["Influencias", "Influences"] },
  { k: "entries", rows: [
    [["Accionismo vienés","Viennese Actionism"], ["La referencia mayor, confirmada por Poell. Cita directa (el círculo de látex rojo de Nitsch), homenaje (la navaja de afeitar de Brus y Schwarzkogler como colgante) y reescritura: al Einmauerung de 1962, en que los accionistas se emparedaron, responde Traditional Escape, en que los modelos escapan.","The major reference, confirmed by Poell. Direct quotation (Nitsch's red latex circle), homage (Brus and Schwarzkogler's razor as a pendant) and rewriting: to the 1962 Einmauerung, in which the actionists walled themselves in, Traditional Escape replies, with the models escaping."], "MICHEL pp. 16-21"],
    [["Nazismo y memoria","Nazism and memory"], ["Michel rastrea el cabello humano, el talle pinzado próximo al uniforme y el bisonte de 2010 como huellas de una pregunta por la creación después de Auschwitz. Su conclusión no es acusatoria sino elegíaca: Poell crea prendas que visten el duelo.","Michel traces the human hair, the nipped waist close to a uniform and the 2010 bison as traces of a question about creation after Auschwitz. His conclusion is not accusatory but elegiac: Poell makes garments that dress mourning."], "MICHEL pp. 16-18, 20-21"],
    [["Kafka y Bernhard","Kafka and Bernhard"], ["Kafka, por el rechazo de la metáfora y la indecisión genérica. Bernhard, por el Entziehung y el lenguaje reducido.","Kafka, for the refusal of metaphor and generic undecidability. Bernhard, for the Entziehung and the reduced language."], "MICHEL p. 22 · LEHMANN p. 179"],
    [["Arte Povera y teoría del lujo","Arte Povera and luxury theory"], ["Donde el Arte Povera usaba carbón o acero, Poell usa realidad biológica y materiales industriales difíciles. Leído contra Baudrillard: al exponer las venas y usar sangre, reintroduce lo Real y el objeto deja de ser simulacro.","Where Arte Povera used coal or steel, Poell uses biological reality and difficult industrial materials. Read against Baudrillard: by exposing the veins and using blood, he reintroduces the Real and the object stops being a simulacrum."], "OAC"],
    [["Marx y Hegel","Marx and Hegel"], ["Prioridad de la infraestructura sobre la superestructura: el material y su fabricación preceden a la forma. Y el Aufheben hegeliano para explicar cómo las últimas costuras superan a las anteriores.","The priority of infrastructure over superstructure: the material and its manufacture precede the form. And the Hegelian Aufheben to explain how the later seams sublate the earlier ones."], "MICHEL pp. 9-10"],
    [["Referencialidad","Referentiality"], ["Parafernalia médica y militar del siglo XX: chaleco salvavidas de 1967, bolsa soviética de 1961, imperdibles de lavandería de la 2.ª Guerra, delantal de artesano, costuras divergentes de la militaria vintage.","Twentieth-century medical and military paraphernalia: a 1967 life vest, a 1961 Soviet bag, WWII laundry pins, a craftsman's apron, the divergent seams of vintage militaria."], "POELLINFO c. 1"]
  ]}
]},

{ id: "obra", n: "06", t: ["Obra y contexto", "Work and context"], blocks: [

  { k: "entries", rows: [
    [["Three Refrigerated Cells · 28.06.2000","Three Refrigerated Cells · 28.06.2000"], ["Tres cámaras de un matadero: la colección · los animales desollados en gasa · una silla frente a un espejo. «¿Puedes con esto? ¿Cómo lo llevas?» Iba dirigida a compradores y prensa, no al público.","Three chambers of a slaughterhouse: the collection · the flayed animals in gauze · a chair facing a mirror. “Can you take this? How do you deal with it?” It was aimed at buyers and press, not at the public."], ""],
    [["Public Freedom · 17.01.2001","Public Freedom · 17.01.2001"], ["En una perrera, con siete minutos de ladridos en bucle. «Me pregunté cuál es la diferencia entre nosotros y la gente que está en la cárcel.»","In a dog pound, with seven minutes of barking on loop. “I asked myself what the difference is between us and people who are in prison.”"], ""],
    [["Traditional Escape · SS 02","Traditional Escape · SS 02"], ["Modelos con los ojos vendados descolgándose por la ventana del estudio con sábanas anudadas. Las prendas hacen lo mismo: la piel «escapa» a través del láser, la malla y el cuero transparente.","Blindfolded models abseiling out of the studio window on knotted sheets. The garments do the same: the skin “escapes” through the laser, the mesh and the transparent leather."], ""],
    [["Mainstream-Downstream · SS 04","Mainstream-Downstream · SS 04"], ["17 modelos «muertos» flotando por el Naviglio Grande con ropa que se arruinaba al sumergirse. Sin pasarela ni asientos: cualquier transeúnte podía mirar. Su última presentación crítica.","17 “dead” models floating down the Naviglio Grande in clothes that were ruined by submersion. No runway, no seats: any passer-by could watch. His last critical presentation."], ""],
    [["Selfsame · 2009","Selfsame · 2009"], ["Fábrica ruinosa, ropa colgada de ganchos de carnicero y un círculo de látex rojo en el suelo.","A ruined factory, clothes hung from butcher's hooks and a red latex circle on the floor."], ""],
    [["Squartter · 14.04.2010","Squartter · 14.04.2010"], ["Un caballo desollado y curtido en una sola pieza, cosido con el scar-stitch de la casa. Vendido, con ironía, como sofá.","A horse flayed and tanned in a single piece, sewn with the house's scar-stitch. Sold, with irony, as a sofa."], ""]
  ]},
  { k: "note", ref: "POELLINFO c. 6 · 15 · 18 · 7", tx: [
    "Cada presentación está descrita en detalle, con citas de época, en POELLINFO. Casi todas están filmadas.",
    "Each presentation is described in detail, with period quotes, in POELLINFO. Almost all of them were filmed."
  ]},
  { k: "sub", tx: ["Mercado", "Market"] },
  { k: "entries", rows: [
    [["Escasez real","Real scarcity"], ["Los minoristas reciben a menudo un cuarto de lo que piden y hay dos años de lista de espera por cliente. No nace de una estrategia de demanda artificial sino de límites materiales: el proceso es lento y autolimitado.","Retailers often receive a quarter of what they order and there is a two-year waiting list per client. It does not come from a strategy of artificial demand but from material limits: the process is slow and self-limiting."], "LEHMANN pp. 180-181"],
    [["El corte de 2010","The 2010 cut-off"], ["Da el diseño por terminado. La facturación sube cada año pese a limitar la producción. Cualquier serie nueva llevaría fecha «2011».","He declares the design finished. Turnover rises every year despite limiting production. Any new series would be dated “2011”."], "LEHMANN p. 181"],
    [["Influencia y copia","Influence and copying"], ["Marcas mayores adaptan y simplifican sus hallazgos, a menudo con los mismos fabricantes. Rige la «ley de la visibilidad»: la marca más visible retiene la reclamación de originalidad. El drip ha sido replicado por varias firmas eliminando justo lo que lo definía, la incomodidad inicial.","Bigger brands adapt and simplify his findings, often with the same manufacturers. The “law of visibility” rules: the most visible brand keeps the claim to originality. The drip has been replicated by several labels, removing exactly what defined it — the initial discomfort."], "LEHMANN p. 176 · OAC"],
    [["Su lugar","His place"], ["En 2001 el catálogo Landed–Geland ya lo contaba entre Margiela, Raf Simons, Chalayan, Comme des Garçons y Viktor & Rolf. Fashion Now 2 lo llama «una anomalía» en un Milán orgulloso del matrimonio entre comercio y creatividad.","By 2001 the Landed–Geland catalogue already counted him among Margiela, Raf Simons, Chalayan, Comme des Garçons and Viktor & Rolf. Fashion Now 2 calls him “an anomaly” in a Milan proud of the marriage between commerce and creativity."], "LANDED p. 30 · FASHIONNOW2 p. 138"]
  ]}
]},

    "Cuatro puntos donde las fuentes se contradicen o donde circula información falsa. Conviene tenerlos presentes antes de citar cualquier dato.",

  { k: "entries", rows: [
    [["El animal vivo","The live animal"], ["Falso. El bulo sobre la chaqueta de FW 98-99 nace de un anuncio de subasta japonés que hablaba de tinta inyectada en una piel antes del curtido. La veteadura es un defecto reconocido del cuero curtido al cromo, usable con fines artísticos.","False. The hoax about the FW 98-99 jacket comes from a Japanese auction listing that mentioned ink injected into a hide before tanning. The marbling is a recognised defect of chrome-tanned leather, usable for artistic ends."], "POELLINFO c. 27"],
    [["La incomodidad","The discomfort"], ["Matizada por el propio estudio, que ha refinado patrones para adecuarlos a la comodidad precisamente para disipar el mito. La comodidad es diferida, no negada.","Qualified by the studio itself, which has refined patterns for comfort precisely in order to dispel the myth. Comfort is deferred, not denied."], "POELLINFO c. 3"],
    [["Fechas en conflicto","Conflicting dates"], ["Primera colección: FW 94-95 o 1995 según la fuente —se reconcilia distinguiendo producción de presentación pública—. Primera FE-MALE: 1998 o 1999. Squartter: el texto dice 2010, la invitación reproducida dice 2011.","First collection: FW 94-95 or 1995 depending on the source — reconciled by distinguishing production from public presentation. First FE-MALE: 1998 or 1999. Squartter: the text says 2010, the reproduced invitation says 2011."], "POELLINFO · MICHEL p. 1"],
    [["La boa de intestino","The intestine boa"], ["Kitchell la atribuye primero a la anguila y luego al cerdo. Prevalece POELLINFO, que consultó directamente al estudio: es intestino de cerdo, material que internamente se llama DARM.","Kitchell first attributes it to eel and then to pig. POELLINFO prevails, having consulted the studio directly: it is pig intestine, internally called DARM."], "POELLINFO c. 20"]
  ]}
]},

/* ---- estado ---- */
let lang = "es", theme = "auto", view = "index";
const idx = "nums", read = "cont";   // decidido: Números + Continua
let cur = 0;


const L = v => Array.isArray(v) ? (lang === "es" ? v[0] : v[1]) : v;
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const E = v => esc(L(v));

/* ---- bloques ---- */
function blocks(list) {
  return `<div class="b">` + list.map(b => {
    switch (b.k) {
      case "sub": return `<h3>${E(b.tx)}</h3>`;
      case "p": return `<p>${E(b.tx)}</p>`;
      case "note": return `<p class="note">${E(b.tx)}${b.ref ? `<span class="ref">→ ${esc(b.ref)}</span>` : ""}</p>`;
      case "fields": return `<dl>${b.rows.map(([k, v]) => `<div><dt>${E(k)}</dt><dd>${E(v)}</dd></div>`).join("")}</dl>`;
      case "entries": return `<dl>${b.rows.map(([k, v, r, img]) => `<div><dt>${E(k)}</dt><dd>${E(v)}${r ? `<span class="ref">→ ${esc(r)}</span>` : ""}${img ? `<figure class="ex"><img src="${esc(img)}" alt="${E(k)}" loading="lazy"><figcaption><a href="https://www.instagram.com/poellinfo/" target="_blank" rel="noopener">@poellinfo ↗</a></figcaption></figure>` : ""}</dd></div>`).join("")}</dl>`;
      case "timeline": return `<div class="scroll"><table class="tl"><tbody>${b.rows.map(([d, t, v]) =>
        `<tr><td>${esc(d)}</td><td>${E(t)}</td><td>${E(v)}</td></tr>`).join("")}</tbody></table></div>`;
      case "table": return `<div class="scroll"><table><thead><tr>${b.head.map(h => `<th>${E(h)}</th>`).join("")}</tr></thead><tbody>${
        b.rows.map(r => `<tr>${r.map(c => `<td>${E(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      case "label": return `<div class="anat"><p class="code">${b.parts.map(p => `<b>${esc(p[0])}</b>`).join("")}</p>
        <dl>${b.parts.map(p => `<div><dt>${esc(p[0])}</dt><dd>${E(p[1])}</dd></div>`).join("")}</dl>
        <p class="note">${E(b.tail)}</p></div>`;
      case "colors": return `<h3>${E(b.tx)}</h3><div class="colors">${b.rows.map(([c, hex, n]) =>
        `<div><i style="background:${hex}"></i><span><b>${esc(c)}</b> ${E(n)}</span></div>`).join("")}</div><p class="note">${E(b.note)}</p>`;
      case "sources": return `<div class="sources">${b.rows.map(([sg, ref, desc]) =>
        `<div><span class="sg">${esc(sg)}</span><span>${E(ref)}</span><span class="st">${E(desc)}</span></div>`).join("")}</div>`;
      default: return "";
    }
  }).join("") + `</div>`;
}

/* ---- enlaces al final de cada tema ----------------------------
   pdf/txt/img: enlace de nube si está cargado en FUENTES, si no la
   ruta local. html: siempre la dirección original en línea.
   vídeo: se reproduce dentro de la página.                        */
const OFFLINE_OK = location.protocol === "file:";
const enc = p => encodeURI(p).replace(/#/g, "%23");

function href(it) {
  if (it.k === "web" || it.k === "video") return it.href;
  const f = FUENTES[it.sig];
  if (!f) return "#";
  const page = it.k === "pdf" && it.page ? it.page : null;
  if (!FUENTES_LOCALES && f.web) {
    if (page && f.pages === "ia") return f.web + "/page/" + page;   // el visor de archive.org sí acepta la página
    return f.web;
  }
  if (it.k === "pdf") return enc(f.file) + (page ? "#page=" + page : "");
  if (it.k === "folder") return enc(f.file);
  return enc(f.file + (it.file || ""));
}
const isLocal = it => !/^https?:/i.test(href(it));   // enlace dentro del repo
/* los clips del archivo son archivos de vídeo: siempre del repo, nunca el perfil */
const repoHref = it => { const f = FUENTES[it.sig]; return f ? enc(f.file + (it.file || "")) : "#"; };

function embedURL(u) {
  let m = u.match(/[?&]v=([\w-]+)/) || u.match(/youtu\.be\/([\w-]+)/);
  if (m) return "https://www.youtube-nocookie.com/embed/" + m[1] + "?autoplay=1";
  m = u.match(/vimeo\.com\/(\d+)/);
  if (m) return "https://player.vimeo.com/video/" + m[1] + "?autoplay=1";
  return u;
}

function videoCard(it, i) {
  const u = it.k === "clip" ? repoHref(it) : href(it);
  const away = it.k === "clip" ? ((FUENTES[it.sig] && FUENTES[it.sig].web) || u) : u;
  const kind = it.k === "clip" ? "clip" : /vimeo/.test(u) ? "vimeo" : "youtube";
  return `<figure class="vid" data-src="${esc(it.k === "clip" ? u : embedURL(u))}" data-kind="${kind}">
    <button class="play" type="button" aria-label="${lang === "es" ? "Reproducir" : "Play"} ${esc(it.label)}">
      <span class="tri" aria-hidden="true"></span>
    </button>
    <figcaption><span class="t">${esc(it.label)}</span><a href="${esc(away)}" target="_blank" rel="noopener" title="${lang === "es" ? "Abrir en el origen" : "Open at source"}">↗</a></figcaption>
  </figure>`;
}
function linksOf(id) {
  const all = LINKS[id] || [];
  if (!all.length) return "";
  const vids = all.filter(x => x.k === "video" || x.k === "clip");
  const docs = all.filter(x => x.k !== "video" && x.k !== "clip");
  const warn = lang === "es" ? "Archivo del repositorio; falta subirlo a /fuentes" : "Repository file; still to be uploaded to /fuentes";
  let out = "";
  if (docs.length) out += `<div class="links">
    <h3>${lang === "es" ? "Enlaces" : "Links"} · ${docs.length}</h3>
    <ul>${docs.map(it => {
      const loc = isLocal(it);
      return `<li><a href="${esc(href(it))}" target="_blank" rel="noopener"${loc && !OFFLINE_OK ? ` data-local="1" title="${warn}"` : ""}><span class="ar">→</span>${esc(it.label)}</a></li>`;
    }).join("")}</ul></div>`;
  if (vids.length) out += `<div class="links vids">
    <h3>${lang === "es" ? "Vídeos" : "Videos"} · ${vids.length}</h3>
    <div class="grid">${vids.map(videoCard).join("")}</div></div>`;
  return out;
}

/* ---- portada ---- */
function cover() {
  return `<div class="cover">
    <p class="title">${E(UI.designers)}</p>
    <nav class="list">${DESIGNERS.map(d => d.ready
      ? `<a class="designer" href="#${d.id}" data-open="${d.id}">${esc(d.name)}</a>`
      : `<span class="designer pending">${esc(d.name)}</span>`).join("")}</nav>
  </div>`;
}

/* ---- índice horizontal ---- */
function strip() {
  const items = CCP.sections.map((s, i) => {
    const on = read === "one" ? i === cur : i === cur;
    const label = idx === "nums" ? "" : `<span>${E(s.t)}</span>`;
    return `<button data-sec="${i}" aria-current="${on}"><span class="n">${esc(s.n)}</span>${label}</button>`;
  }).join("");
  const now = idx === "nums" ? `<span class="now">${E(CCP.sections[cur].t)}</span>` : "";
  return `<nav class="idxbar i-${idx}"><div class="strip">${items}${now}</div></nav>`;
}

/* ---- ficha ---- */
function file() {
  const secs = read === "one" ? [CCP.sections[cur]] : CCP.sections;
  const nav = false ? `<div class="nav">
      <button data-sec="${cur - 1}" ${cur === 0 ? "disabled" : ""}>${cur > 0 ? "← " + E(CCP.sections[cur - 1].t) : ""}</button>
      <button data-sec="${cur + 1}" ${cur === CCP.sections.length - 1 ? "disabled" : ""}>${cur < CCP.sections.length - 1 ? E(CCP.sections[cur + 1].t) + " →" : ""}</button>
    </div>` : "";
  return `<article class="file r-${read}">
    <div class="pad">
      <p class="back"><a href="#" data-open="index">← ${E(UI.designers)}</a></p>
      <header class="masthead">
        <h1>${esc(CCP.name)}</h1>
        <p class="dek">${E(CCP.sub)}</p>
      </header>
    </div>
    ${strip()}
    <div class="pad body">
      ${secs.map(s => `<section class="sec" id="s-${s.id}">
        <h2><span class="n">${esc(s.n)}</span>${E(s.t)}</h2>${blocks(s.blocks)}${linksOf(s.id)}</section>`).join("")}
      ${nav}
    </div>
  </article>`;
}

/* ---- pintar ---- */
function paint(top) {
  document.documentElement.lang = lang;
  document.body.dataset.view = view;
  if (theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;

  const words = { es: { auto: "sistema", light: "claro", dark: "oscuro" },
                  en: { auto: "system", light: "light", dark: "dark" } }[lang];
  document.querySelectorAll(".settings [data-lang]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.querySelectorAll(".settings [data-theme]").forEach(b => {
    b.textContent = words[b.dataset.theme];
    b.setAttribute("aria-pressed", String(b.dataset.theme === theme));
  });

  const y = top ? 0 : window.scrollY;
  document.getElementById("view").innerHTML = view === "index" ? cover() : file();
  window.scrollTo({ top: y, behavior: "instant" });
  spy();
  centerStrip();
  progress();
}

/* barra de progreso de lectura, sólo en la ficha */
function progress() {
  const bar = document.querySelector(".progress i");
  if (!bar) return;
  if (view !== "ccp") { bar.style.width = "0%"; return; }
  const max = document.documentElement.scrollHeight - window.innerHeight;
  bar.style.width = (max > 0 ? Math.min(100, Math.max(0, window.scrollY / max * 100)) : 0) + "%";
}

/* en lectura continua, marcar la sección que se está leyendo */
function spy() {
  if (view !== "ccp" || read !== "cont") return;
  const secs = [...document.querySelectorAll(".sec")];
  if (!secs.length) return;
  const line = window.scrollY + parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bar"))
             + parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--set"))
             + parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--idx")) + 24;
  let i = 0;
  secs.forEach((s, k) => { if (s.offsetTop <= line) i = k; });
  if (i !== cur) { cur = i; markStrip(); centerStrip(); }
}
function markStrip() {
  document.querySelectorAll(".idxbar [data-sec]").forEach((b, i) =>
    b.setAttribute("aria-current", String(i === cur)));
  const now = document.querySelector(".idxbar .now");
  if (now) now.textContent = L(CCP.sections[cur].t);
}
/* que el ítem activo quede siempre visible en la tira */
function centerStrip() {
  const st = document.querySelector(".idxbar .strip");
  if (!st) return;
  const b = st.querySelector('[data-sec][aria-current="true"]');
  if (!b) return;
  const l = b.offsetLeft, r = l + b.offsetWidth;
  if (l < st.scrollLeft || r > st.scrollLeft + st.clientWidth)
    st.scrollTo({ left: l - st.clientWidth / 2 + b.offsetWidth / 2, behavior: "instant" });
}

function go(v, push) {
  view = v; cur = 0;
  if (push) history.pushState({ view: v }, "", v === "index" ? "#" : "#" + v);
  paint(true);
}

document.addEventListener("click", e => {
  const l = e.target.closest(".settings [data-lang]");
  if (l) { lang = l.dataset.lang; paint(false); return; }
  const th = e.target.closest(".settings [data-theme]");
  if (th) { theme = th.dataset.theme; paint(false); return; }
  const sc = e.target.closest("[data-sec]");
  if (sc && !sc.disabled) {
    const i = Math.max(0, Math.min(CCP.sections.length - 1, +sc.dataset.sec));
    if (read === "one") { cur = i; paint(true); }
    else {
      cur = i; markStrip(); centerStrip();
      const el = document.getElementById("s-" + CCP.sections[i].id);
      if (el) el.scrollIntoView({ block: "start" });
    }
    return;
  }
  const pl = e.target.closest(".vid .play");
  if (pl) {
    const fig = pl.closest(".vid");
    const s = fig.dataset.src;
    pl.outerHTML = fig.dataset.kind === "clip"
      ? `<video src="${s}" controls autoplay playsinline></video>`
      : `<iframe src="${s}" title="${pl.getAttribute("aria-label")}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
    return;
  }
  const o = e.target.closest("[data-open]");
  if (o) { e.preventDefault(); go(o.dataset.open, true); }
});

window.addEventListener("popstate", () => {
  const h = location.hash.replace("#", "");
  if (h.startsWith("s-")) return;
  go(h === "ccp" ? "ccp" : "index", false);
});

const onScroll = () => {
  if (window.scrollY > 8) document.body.setAttribute("data-scrolled", "");
  else document.body.removeAttribute("data-scrolled");
  spy();
  progress();
};
window.addEventListener("scroll", onScroll, { passive: true });
window.addEventListener("resize", progress, { passive: true });

view = location.hash.replace("#", "") === "ccp" ? "ccp" : "index";
paint(true);
onScroll();
</script>

</body>
</html>
